<!doctype html><html lang="en" class="dark-mode"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chrono - WebRTC Packet Test</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script defer="defer" src="bundle.js"></script></head><body><div class="container"><header><div class="logo-container"><img src="img/chrono-bold-white.png" alt="Chrono" class="logo-image"></div></header><main><div class="test-container"><div class="test-circle-container"><div class="test-circle"><div class="test-progress-circle"></div><div class="test-button">GO</div></div></div><div class="test-results" style="display: none;"><div class="results-header"><h2>Test Results</h2></div><div class="results-cards"><div class="result-card"><h3>Packet Loss</h3><div class="result-value" id="packet-loss-value">0%</div></div><div class="result-card"><h3>MOS Score</h3><div class="result-value"><span id="mos-grade">-</span> <span id="mos-value">-</span></div></div><div class="result-card"><h3>Avg. Latency</h3><div class="result-value" id="avg-latency">0 ms</div></div></div><div class="chart-container"><canvas id="packet-chart"></canvas></div><button class="test-again-btn">Test Again</button></div></div></main><footer><p>Chrono uses WebRTC to measure your connection quality</p></footer></div></body></html>
